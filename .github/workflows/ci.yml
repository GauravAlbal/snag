name: CI

"on":
  push:
    branches: [main, feat/*]
  pull_request:

env:
  CARGO_TERM_COLOR: always
jobs:
  gates:
    name: Gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features --no-fail-fast

      - name: Release build smoke
        run: cargo build --release --target ${{ matrix.target }}

      - name: Version output
        run: ./target/${{ matrix.target }}/release/snag --version

  deps:
    name: Dependencies (licenses, bans, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny (licenses, bans, advisories)
        run: cargo deny check

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        # Advisory exceptions require a documented justification in the PR
        # (see CONTRIBUTING.md "Dependency and advisory policy"). Ignore lists
        # live here, keyed to the RUSTSEC id, never added silently.
        run: cargo audit
