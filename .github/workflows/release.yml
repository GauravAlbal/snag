name: Release

"on":
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Capture version output
        run: ./target/${{ matrix.target }}/release/snag --version > version.txt

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: snag-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/snag
          if-no-files-found: error

      - name: Upload version artifact
        uses: actions/upload-artifact@v4
        with:
          name: version-${{ matrix.target }}
          path: version.txt
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release binaries
        run: |
          mkdir -p release-binaries
          for dir in artifacts/snag-*/; do
            name="$(basename "$dir")"
            cp "$dir/snag" "release-binaries/$name"
          done
          # First version file wins (identical across platforms by construction).
          cp "$(find artifacts/version-* -name version.txt | head -1)" release-binaries/version.txt
          chmod +x release-binaries/snag-*
          ls -la release-binaries

      - name: Generate SHA-256 checksums
        run: |
          (cd release-binaries && shasum -a 256 snag-* version.txt > SHA256SUMS.txt)
          cat release-binaries/SHA256SUMS.txt

      - name: Record source SHA (provenance)
        run: echo "${{ github.sha }}" > release-binaries/source-sha.txt

      - name: Generate CycloneDX SBOM (best-effort)
        continue-on-error: true
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --all-features --output sbom.xml
          cp sbom.xml release-binaries/sbom-cyclonedx.xml || true

      - name: Determine tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: snag ${{ steps.tag.outputs.tag }}
          body: |
            See [CHANGELOG.md](CHANGELOG.md) for what changed in this release.

            ## Binaries

            - `snag-x86_64-unknown-linux-gnu` — Linux x86_64
            - `snag-aarch64-unknown-linux-gnu` — Linux arm64
            - `snag-aarch64-apple-darwin` — macOS arm64

            ## Provenance

            - Source SHA: `${{ github.sha }}` (see `source-sha.txt`)
            - Version: see `version.txt`
            - SBOM: `sbom-cyclonedx.xml` (best-effort)

            ## Verify

            ```sh
            shasum -a 256 -c SHA256SUMS.txt
            ```
          files: |
            release-binaries/*
          fail_on_unmatched_files: true
