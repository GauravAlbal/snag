[package]
name = "snag"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.5"
clap = { version = "4.6.5", features = ["derive"] }
directories = "6.0.0"
rusqlite = { version = "0.40.1", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.19"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ulid = "3.0.0"
