[package]
name = "snag"
version = "0.1.0"
edition = "2024"
description = "Durable observation capture for agent fleets: atomic bug/friction reports with repo, worktree, pearl, and tool context."
license = "MIT"
repository = "https://github.com/13banditos/snag"
readme = "README.md"
keywords = ["observability", "agent", "reporting", "incident", "sqlite"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.5"
clap = { version = "4.6.5", features = ["derive"] }
directories = "6.0.0"
flate2 = "1.1.9"
rusqlite = { version = "0.40.1", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.19"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ulid = "3.0.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
