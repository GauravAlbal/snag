[package]
name = "snag"
version = "0.2.0"
edition = "2024"
description = "Durable observation outbox for coding agents: capture out-of-scope bugs and friction with evidence, then keep going."
license = "Apache-2.0"
repository = "https://github.com/GauravAlbal/snag"
readme = "README.md"
keywords = ["observability", "agent", "reporting", "incident", "sqlite"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.5"
clap = { version = "4.6.5", features = ["derive"] }
directories = "6.0.0"
flate2 = "1.1.9"
rusqlite = { version = "0.40.1", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1.0.151"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.19"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ulid = "3.0.0"
libc = "0.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

# Lean release binaries for distribution (mirrors the launch profile used by
# popular Rust CLIs: size-optimized, LTO, single codegen unit, stripped).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
